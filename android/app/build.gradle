plugins {
    id "com.android.application"
}

android {
    namespace "com.olivierh.kickoff2"
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "com.olivierh.kickoff2"
        minSdk 23
        targetSdk 36
        versionCode 62
        versionName "0.4.58"
    }

    signingConfigs {
        debug {
            // Keep the disposable development key inside the project cache.
            storeFile file("../../.cache/android/debug.keystore")
            storeType "PKCS12"
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation files("libs/kickoff2.aar")
}
